name: Dump GitHub Runner State

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - minimal-ubuntu-latest-4x
    steps:
      - name: Full runner manifest
        run: |
          set +e

          section() { echo; echo "==============================================================================="; echo "=== $1"; echo "==============================================================================="; }

          # ─── OS & Kernel ───────────────────────────────────────────────────
          section "OS Release"
          cat /etc/os-release

          section "Kernel"
          uname -a

          section "Kernel command line"
          cat /proc/cmdline

          section "Kernel modules loaded"
          lsmod | sort

          section "Kernel modules available"
          find /lib/modules/$(uname -r)/kernel -name '*.ko*' 2>/dev/null | sed 's|.*/||;s|\.ko.*||' | sort

          section "sysctl (non-default)"
          sudo sysctl -a 2>/dev/null | sort

          # ─── Hardware / Virtualization ─────────────────────────────────────
          section "CPU info"
          lscpu

          section "Memory"
          free -h
          cat /proc/meminfo

          section "Block devices"
          lsblk -f

          section "Disk usage"
          df -h

          section "Mount points"
          mount | sort

          section "/etc/fstab"
          cat /etc/fstab

          section "Virtualization"
          systemd-detect-virt 2>/dev/null || echo "unknown"
          cat /sys/class/dmi/id/product_name 2>/dev/null || true
          cat /sys/class/dmi/id/sys_vendor 2>/dev/null || true

          # ─── Users & Auth ──────────────────────────────────────────────────
          section "Current user"
          whoami
          id

          section "/etc/passwd (uid >= 900)"
          awk -F: '$3 >= 900 {print}' /etc/passwd

          section "/etc/group (gid >= 900 or interesting)"
          awk -F: '$3 >= 900 || $1 ~ /docker|sudo|admin|runner/' /etc/group

          section "sudoers.d"
          sudo ls -la /etc/sudoers.d/
          for f in /etc/sudoers.d/*; do
            echo "--- $f ---"
            sudo cat "$f" 2>/dev/null
          done

          section "/etc/sudoers (non-comment)"
          sudo grep -v '^#\|^$' /etc/sudoers 2>/dev/null

          # ─── Environment ───────────────────────────────────────────────────
          section "/etc/environment"
          cat /etc/environment

          section "Environment variables"
          env | grep -v 'GITHUB_TOKEN\|ACTIONS_RUNTIME_TOKEN\|ACTIONS_ID_TOKEN' | sort

          section "PATH breakdown"
          echo "$PATH" | tr ':' '\n'

          section "/etc/profile.d scripts"
          ls -la /etc/profile.d/
          for f in /etc/profile.d/*.sh; do
            echo "--- $f ---"
            cat "$f"
          done

          section "Shell rc files"
          for f in /home/runner/.bashrc /home/runner/.bash_profile /home/runner/.profile /root/.bashrc; do
            echo "--- $f ---"
            sudo cat "$f" 2>/dev/null || echo "not found"
          done

          # ─── Filesystem Layout ─────────────────────────────────────────────
          section "/ top-level"
          ls -la /

          section "/home/runner full listing"
          ls -la /home/runner/
          find /home/runner -maxdepth 2 -not -path '*/actions-runner/_work/*' -not -path '*/.cache/*' | sort

          section "/home/runner dotfiles and configs"
          for d in .config .local .local/bin .local/share .local/state .cargo .cargo/bin .rustup .nvm .dotnet .dotnet/tools .ghcup .npm .yarn; do
            echo "--- /home/runner/$d ---"
            ls -la "/home/runner/$d" 2>/dev/null || echo "not found"
          done

          section "/usr/local full tree (depth 3)"
          find /usr/local -maxdepth 3 -not -path '*/lib/python*' -not -path '*/lib/node_modules/*' -not -path '*/share/man/*' -not -path '*/share/doc/*' | sort

          section "/usr/local/bin"
          ls -la /usr/local/bin/

          section "/opt full tree (depth 3)"
          find /opt -maxdepth 3 2>/dev/null | sort

          section "/opt/hostedtoolcache (depth 4)"
          find /opt/hostedtoolcache -maxdepth 4 -type d 2>/dev/null | sort

          section "/snap"
          ls -la /snap/ 2>/dev/null || echo "not found"

          section "/imagegeneration"
          ls -la /imagegeneration/ 2>/dev/null || echo "not found"
          cat /imagegeneration/imagedata.json 2>/dev/null || echo "not found"
          cat /imagegeneration/installedSoftware.md 2>/dev/null || echo "not found"

          # ─── Package Management ────────────────────────────────────────────
          section "APT sources"
          cat /etc/apt/sources.list 2>/dev/null || true
          cat /etc/apt/sources.list.d/*.list 2>/dev/null || true
          ls -la /etc/apt/sources.list.d/

          section "APT keys"
          ls -la /etc/apt/keyrings/ 2>/dev/null || true
          ls -la /etc/apt/trusted.gpg.d/ 2>/dev/null || true

          section "All installed deb packages with versions"
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' | sort

          section "Packages on hold"
          apt-mark showhold 2>/dev/null

          section "Snap packages"
          snap list 2>/dev/null || echo "no snap"

          section "Homebrew packages"
          brew list --versions 2>/dev/null || echo "no brew"

          section "pip3 global packages"
          pip3 list --format=freeze 2>/dev/null || echo "not found"

          section "pipx packages"
          pipx list 2>/dev/null || echo "not found"

          section "npm global packages"
          npm list -g --depth=0 2>/dev/null || echo "not found"

          section "gem list"
          gem list 2>/dev/null || echo "not found"

          section "cargo installed"
          ls -la ~/.cargo/bin/ 2>/dev/null || echo "not found"

          section "go env"
          go env 2>/dev/null || echo "not found"

          section "dotnet global tools"
          dotnet tool list -g 2>/dev/null || echo "not found"

          # ─── Tool Versions ─────────────────────────────────────────────────
          section "Tool versions"
          for tool in \
            node npm yarn pnpm corepack \
            python3 pip3 python \
            go rustc cargo rustup \
            java javac \
            dotnet \
            docker "docker compose" "docker buildx" \
            gcc g++ gfortran make cmake ninja-build \
            clang clang++ lld lldb \
            gh az aws kubectl helm terraform packer pulumi \
            ruby gem bundler \
            php composer \
            swift kotlin julia pwsh R \
            bazel ant gradle mvn sbt \
            conda \
            git git-lfs curl wget jq yq zstd \
            shellcheck shfmt \
            podman buildah skopeo \
            kind minikube kustomize \
            azcopy bicep vcpkg \
            chromium-browser google-chrome firefox microsoft-edge \
            chromedriver geckodriver \
            swig m4 autoconf automake libtool pkg-config \
            openssl ssh zip unzip 7z xz bzip2 \
            lsb_release dpkg apt snap flatpak \
            systemctl journalctl \
            perl sed awk grep find xargs \
            nft iptables ip ss \
            gpg gpg-agent \
            brew; do
            bin=$(echo "$tool" | awk '{print $1}')
            path=$(which "$bin" 2>/dev/null)
            if [ -n "$path" ]; then
              ver=$($tool --version 2>/dev/null | head -1)
              [ -z "$ver" ] && ver=$($tool version 2>/dev/null | head -1)
              [ -z "$ver" ] && ver=$($tool -version 2>/dev/null | head -1)
              [ -z "$ver" ] && ver=$($tool -V 2>/dev/null | head -1)
              printf "%-30s %-60s %s\n" "$tool" "$ver" "$path"
            fi
          done

          section "GCC versions available"
          ls /usr/bin/gcc-* /usr/bin/g++-* /usr/bin/gfortran-* 2>/dev/null || echo "none"

          section "Clang versions available"
          ls /usr/bin/clang-?? /usr/bin/clang++-?? /usr/bin/lld-?? /usr/bin/lldb-?? 2>/dev/null || echo "none"

          section "Python alternatives"
          update-alternatives --list python 2>/dev/null || echo "none"
          update-alternatives --list python3 2>/dev/null || echo "none"
          ls /usr/bin/python* 2>/dev/null

          section "Java alternatives"
          update-alternatives --list java 2>/dev/null || echo "none"
          ls /usr/lib/jvm/ 2>/dev/null
          echo "JAVA_HOME=$JAVA_HOME"

          section "Node via nvm"
          bash -c 'source /home/runner/.nvm/nvm.sh 2>/dev/null && nvm list' 2>/dev/null || echo "not found"

          # ─── Language Runtimes Detail ──────────────────────────────────────
          section "Rust detail"
          rustup show 2>/dev/null || echo "not found"
          rustup target list --installed 2>/dev/null || echo "not found"
          rustup component list --installed 2>/dev/null || echo "not found"

          section "Dotnet detail"
          dotnet --list-sdks 2>/dev/null || echo "not found"
          dotnet --list-runtimes 2>/dev/null || echo "not found"

          section "Java detail"
          java --version 2>/dev/null || echo "not found"
          ls -la /usr/lib/jvm/ 2>/dev/null

          section "Android SDK"
          ls /usr/local/lib/android/sdk/ 2>/dev/null || echo "not found"
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || echo "not found"
          ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null || echo "not found"
          ls /usr/local/lib/android/sdk/ndk/ 2>/dev/null || echo "not found"
          ls /usr/local/lib/android/sdk/cmdline-tools/ 2>/dev/null || echo "not found"
          ls /usr/local/lib/android/sdk/system-images/ 2>/dev/null || echo "not found"
          cat /usr/local/lib/android/sdk/cmdline-tools/latest/source.properties 2>/dev/null || true

          section "Haskell/GHCup"
          ghcup list 2>/dev/null || echo "not found"

          # ─── Shared Libraries ──────────────────────────────────────────────
          section "Shared library cache summary"
          ldconfig -p 2>/dev/null | wc -l
          ldconfig -p 2>/dev/null | awk -F' => ' '{print $2}' | sed 's|/[^/]*$||' | sort -u

          section "Key shared libraries"
          ldconfig -p 2>/dev/null | grep -E 'libssl|libcrypto|libcurl|libz\.|libpthread|libstdc|libgcc|libm\.|libc\.' | sort

          section "/etc/ld.so.conf.d"
          cat /etc/ld.so.conf 2>/dev/null
          cat /etc/ld.so.conf.d/*.conf 2>/dev/null

          section "pkg-config available packages"
          pkg-config --list-all 2>/dev/null | sort || echo "not found"

          # ─── Networking ────────────────────────────────────────────────────
          section "Network interfaces"
          ip addr show 2>/dev/null

          section "Routing table"
          ip route show 2>/dev/null

          section "DNS config"
          cat /etc/resolv.conf
          cat /etc/hosts

          section "iptables rules"
          sudo iptables -L -n 2>/dev/null || echo "not found"
          sudo iptables -t nat -L -n 2>/dev/null || echo "not found"

          section "Listening ports"
          ss -tlnp 2>/dev/null || echo "not found"

          section "nftables"
          sudo nft list ruleset 2>/dev/null || echo "not found"

          # ─── Services & Systemd ────────────────────────────────────────────
          section "Enabled services"
          systemctl list-unit-files --state=enabled --type=service 2>/dev/null

          section "Running services"
          systemctl list-units --type=service --state=running 2>/dev/null

          section "Timers"
          systemctl list-timers --all 2>/dev/null

          section "Failed units"
          systemctl --failed 2>/dev/null

          # ─── Docker ────────────────────────────────────────────────────────
          section "Docker info"
          docker info 2>/dev/null || echo "not found"

          section "Docker images"
          docker images 2>/dev/null || echo "not found"

          section "Docker networks"
          docker network ls 2>/dev/null || echo "not found"

          section "Docker daemon config"
          cat /etc/docker/daemon.json 2>/dev/null || echo "not found"

          section "Docker plugins"
          ls /usr/libexec/docker/cli-plugins/ 2>/dev/null || echo "not found"

          section "containerd config"
          sudo cat /etc/containerd/config.toml 2>/dev/null || echo "not found"

          # ─── Security / Capabilities ───────────────────────────────────────
          section "AppArmor status"
          sudo aa-status 2>/dev/null || echo "not found"

          section "Seccomp"
          grep -i seccomp /proc/self/status 2>/dev/null

          section "Capabilities"
          cat /proc/self/status | grep -i cap

          section "Security limits"
          ulimit -a

          section "/etc/security/limits.conf"
          cat /etc/security/limits.conf 2>/dev/null
          cat /etc/security/limits.d/*.conf 2>/dev/null || true

          # ─── Cron & Scheduled ──────────────────────────────────────────────
          section "Crontabs"
          sudo ls -la /etc/cron.d/ 2>/dev/null
          for f in /etc/cron.d/*; do
            echo "--- $f ---"
            sudo cat "$f" 2>/dev/null
          done
          crontab -l 2>/dev/null || echo "no user crontab"

          # ─── Misc Config ───────────────────────────────────────────────────
          section "Locale"
          locale
          locale -a 2>/dev/null | head -20

          section "Timezone"
          timedatectl 2>/dev/null || echo "not found"
          cat /etc/timezone 2>/dev/null || true

          section "Git config (system)"
          git config --system --list 2>/dev/null || echo "none"

          section "Git config (global)"
          git config --global --list 2>/dev/null || echo "none"

          section "SSH config"
          ls -la /etc/ssh/ 2>/dev/null
          cat /etc/ssh/sshd_config 2>/dev/null | grep -v '^#\|^$' || echo "not found"

          section "SSL/TLS certificates"
          ls /etc/ssl/certs/ 2>/dev/null | wc -l
          ls /usr/local/share/ca-certificates/ 2>/dev/null || echo "none"
          openssl version 2>/dev/null

          section "/etc/skel"
          ls -la /etc/skel/ 2>/dev/null

          section "alternatives (all)"
          update-alternatives --get-selections 2>/dev/null | sort

          section "Tmpfiles / cleanup"
          ls /etc/tmpfiles.d/ 2>/dev/null || echo "none"
          ls /usr/lib/tmpfiles.d/ 2>/dev/null || echo "none"

          section "File descriptor limits"
          cat /proc/sys/fs/file-max
          cat /proc/sys/fs/inotify/max_user_watches

          echo
          echo "=== DUMP COMPLETE ==="
